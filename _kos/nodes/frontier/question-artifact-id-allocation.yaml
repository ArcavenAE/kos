    type: derives
    note: "Independent per-graph allocation is what a subrepo kos workflow does today; the id scheme is downstream of how many graphs there are and how they coordinate"
  - target: question-projection-seam
    type: supports
    note: "A collision-free canonical id is a precondition for projecting nodes across graphs without ambiguity"
