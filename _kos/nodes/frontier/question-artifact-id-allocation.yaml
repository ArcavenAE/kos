id: question-artifact-id-allocation
type: question
confidence: frontier
title: "How should kos allocate artifact ids (findings, nodes, probes, ideas) so that cross-graph and fan-out collisions end?"
content: |
  kos allocates two kinds of id and both collide. Node ids are
  human-readable slugs, unique within one graph and allocated
  independently from a shared vocabulary in about twenty graphs, so the
  same slug names different nodes in different graphs (13 exact
  collisions measured across the fleet on 2026-08-15; finding-131).
  Finding numbers are a sequential counter allocated by read-max-plus-one
  from each session's local tree, and they collide in two distinct ways:
  a race, where two sessions overlap (finding-068: three instances;
  finding-131 addendum: the 123 and 136 pairs), and a fan-out, where N
  arms cloned from one base commit all compute the same next number
  deterministically (2026-08-09: four of six arms allocated finding-019;
  2026-09-15: finding-170 allocated on a branch while main took 170 and
  171, resolved by renumbering to 172). The fan-out case defeats every
  check-the-ledger protocol, because each arm reads the same ledger and
  gets the same confident answer. The counter is a shared mutable
  namespace living exactly where parallelism lives.

  The question is which allocation scheme removes both collision shapes
  without giving up what the slug buys (a reader can tell what a node is
  from its id) or breaking existing ids and edges.

  Candidates on the table, to be weighed against each other rather than
  adopted by default:

  1. **Author slug-only, attach the number at merge** (bd
     `aae-orc-vxaa`). The counter disappears at the point of parallelism;
     cross-references use the slug and survive renumbering; merge order
     becomes the number's meaning. Open: where the number lives, whether
     the back catalogue migrates, what happens to a finding never merged,
     and how independently numbering subrepo graphs relate.
  2. **A bd-style opaque suffix** per artifact (`prefix-{short hash}`),
     allocated at authoring with no merge step. bd's verified algorithm
     (bd 1.1.2 at forks/beads 0c5fa422d): base36 of the leading sha256
     bytes of title, description, actor, created_at, and a nonce,
     truncated to an adaptive length L in 3..8 chosen so the birthday
     bound over the per-prefix count stays at or below 0.25; nonce retry
     at the same length on collision, grow L after ten misses. Because
     the hash input carries created_at and a nonce, fan-out arms hash
     differently even from one base commit, which is the property the
     counter lacks. Cost: the id says nothing to a reader without a
     lookup.
  3. **finding-131's three shapes** for node ids: namespace prefix
     (`graph:slug`, already deployed unmanaged as `aae-orc::` edge
     targets in four subrepo graphs), a two-layer opaque canonical id
     with the slug as a resolving alias (git's model: SHA under, refs
     over), and the Nix-style hybrid `slug-<shortid>` in one string.

  Inputs the probe builds on rather than re-derives: the bd algorithm as
  verified from source against the live db (pinned to code refs in the
  study), git's short-SHA auto-scaling and ambiguity handling (fetched),
  and the fleet's existing unmanaged practice.

  **Structural, so it may gate.** A duplicate finding number is a
  structural defect, not a vital sign; `kos validate` already fails on it
  (kos PR #101) and that check may sit in CI without offending
  `val-diagnostic-never-gate`. Verified 2026-09-16: the check exists in
  src/validate.rs and runs nowhere automatically in the orc (no .github,
  no lefthook.yml). Detection is `aae-orc-ul2h`; this question is about
  allocation, which detection does not fix.

  **Success signal.** A written recommendation, with tradeoffs, that names
  one scheme (or one per id kind) and a migration path that keeps every
  existing slug and edge resolving; the operator rules on it; the first
  fan-out after adoption produces zero duplicate ids without a
  coordinator. **Kill condition.** If every scheme that removes fan-out
  collisions also removes readability and the operator rules readability
  load-bearing, the question closes to the graveyard with the two-layer
  shape recorded as the reason a later attempt should start there.

  **Ruled 2026-09-16 (operator, via the director seat).** Two problems,
  two answers. Node ids: the namespace prefix `graph::slug` is accepted as
  the canonical cross-graph reference. Finding numbers: allocation-at-merge
  is rejected; opaque bd-style ids are adopted now. The decision of record
  is finding-173's ruling section; the bedrock node is
  elem-kos-artifact-id-scheme. What stays open here is the implementation
  and its consequences (sub-questions 3 and 4 below; sub-questions 1 and 2
  are answered by the ruling).

  **Live cross-graph specimen (recorded 2026-09-25).** The number this
  question's own study received is itself a collision: `finding-173` is
  `kos/_kos/findings/finding-173-kos-artifact-id-allocation-study.md`
  (kos 65600f1) and also
  `aae-orc/_kos/findings/finding-173-corrected-premise-never-reached-the-loaded-surface.md`
  (aae-orc 92bec3e), both merged 2026-09-16. A bare "finding-173" in any
  prose, commit or bd note that crosses graphs is ambiguous today, and
  nothing detects it, because each graph validates only itself. The
  `graph::slug` form in the ruling resolves it for nodes; findings wait on
  the opaque-id implementation.

  **Addendum 2026-10-04 (arcaven team harvest).** The opaque-id
  implementation has since landed in kos: `kos id finding <slug>` mints an
  opaque finding id and prints its filename without writing (kos#123, merged
  2026-10-02), and the findings loader classifies numbered and prefixed
  opaque keys (kos#122, merged 2026-10-02). So "no next-free-id primitive" is
  no longer true for findings; what remains is whether authors use it. A
  within-graph specimen from before the primitive: marvel carries two files
  numbered `finding-039`, `finding-039-b69n-contract-lane-harvest.md` (marvel
  0b908f46, 2026-09-14, #251) and
  `finding-039-two-release-runs-race-on-the-tap-push.md` (marvel 422eb11b,
  2026-09-15, #271), one from a finding PR and one from a CI PR. This is
  neither a race nor a fan-out. #271 is one commit whose parent 135015d (#269)
  already contained #251's `finding-039`, and #271 was opened about eighteen
  hours after #251 merged (2026-09-14T22:33Z to 2026-09-15T16:35Z). So the
  second `finding-039` was committed on a tree that already held the first:
  the number was not read from the tree it landed on, which is the case minted
  ids (`kos id finding`) fix most directly. Review 5403982290 ran `kos validate`
  on marvel's `_kos` at b003cd3 and got exit 1, FAIL duplicate 'finding-039'.
  Whether marvel's pair should be renumbered to opaque ids is marvel's call;
  this node records it as a specimen. Two other reported collisions were
  not confirmed and are not recorded: a beadle `finding-025` is held by an
  open PR (beadle#95) while the next number merged (#98), which is a gap, not
  a duplicate; a "next free 062" mislabel could not be traced to a file.

  Sub-questions:
  1. Are node ids and finding numbers one problem or two? The slug
     collides across graphs; the number collides across sessions. One
     scheme may not fit both.
  2. Does allocate-at-merge need a canonical id at all, or is the slug
     plus the merge-assigned number enough when cross-references use the
     slug?
  3. How does any scheme interact with relocation (finding-132,
     `aae-orc-qso2f`): does a moved node keep its id, get a new one, or
     leave a forwarding record?
  4. What is the smallest change that ends the fan-out case this month,
     independent of the full scheme?
