notes: |
  Filed here by the subject test: kos assigns and resolves ids, so the
  question lives in kos's graph even though every specimen is an orc or
  fleet event. bd ticket aae-orc-hf58k was closed 2026-09-02 as "study
  complete" citing finding-131; finding-131 records the observation and
  says the study is not yet filed, so that closure rested on a false
  premise. The probe brief is brief-artifact-id-allocation.md; the study
  output is finding-173-kos-artifact-id-allocation-study.md, which
  recommended namespace-prefixed node ids (graph::slug) together with
  number-at-merge for findings, deferring opaque ids. The operator accepted
  the first and overruled the second in favour of opaque ids now; the
  ruling is recorded in finding-173 and in elem-kos-artifact-id-scheme.
