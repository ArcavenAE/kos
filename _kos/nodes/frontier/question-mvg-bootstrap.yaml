    - "finding-002: Seam test on four documents from one solo project, decomposed into 17 nodes (result: partial). The research critique and the PRDs do not share a model of what matters, e.g. execution telemetry built with no drift measure, and a PRD that pushes more context to agents than the critique's measured ceiling allows."
