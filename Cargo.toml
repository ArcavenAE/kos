[package]
name = "kos"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Graph-based knowledge accumulation for designed systems"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization (the graph substrate is YAML)
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = { version = "1", features = ["preserve_order"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Graph traversal (drift detection, ripple propagation)
petgraph = "0.7"

# File system traversal
walkdir = "2"

# OS random bytes for minted finding ids (opaque-finding-ids design, 2.1)
getrandom = "0.2"

# Usage logging (opt-in)
jiff = "1"
dirs-next = "2"

# Regex for markdown parsing
regex = "1"

# Content hashing for drift detection
sha2 = "0.10"

# Self-update (GitHub releases API)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# Fact store: SQLite in process, compiled in (aae-orc-xxe3n)
rusqlite = { version = "0.43", features = ["bundled"] }

[build-dependencies]
jiff = "1"

[dev-dependencies]
insta = { version = "1", features = ["yaml", "json"] }
tempfile = "3"

# SCIP fixtures for the ingest tests (aae-orc-yto7v). The ingest itself adds
# the crate to [dependencies] when it lands.
scip = "0.10"

[lints.clippy]
cloned_instead_of_copied = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "deny"

[lints.rust]
unsafe_code = "forbid"
